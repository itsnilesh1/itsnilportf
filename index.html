<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nilesh Patil — Computer Engineering Student | Cybersecurity & AI/ML</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#020408;--bg2:#040d14;--bg3:#060f18;
  --neon:#00ff88;--neon2:#00d4ff;--neon3:#ff003c;--neon4:#ffb400;
  --glass:rgba(0,255,136,0.04);--border:rgba(0,255,136,0.15);
  --text:#c8d8e8;--text2:#7a9bb5;
}
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}
::selection{background:rgba(0,255,136,0.2);color:#00ff88;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:#020408;}
::-webkit-scrollbar-thumb{background:linear-gradient(#00ff88,#00d4ff);}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;overflow-x:hidden;cursor:none;}

/* CURSOR */
#cur{position:fixed;width:6px;height:6px;background:#00ff88;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:transform .1s;}
#cur-r{position:fixed;width:28px;height:28px;border:1px solid rgba(0,255,136,.5);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:all .12s ease;mix-blend-mode:screen;}

/* BOOT SCREEN */
#boot{position:fixed;inset:0;background:#020408;z-index:99997;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;}
#boot-lines{font-size:13px;color:#00ff88;line-height:2;text-align:left;max-width:600px;width:90%;}
.boot-line{opacity:0;animation:bootFade .3s forwards;}
@keyframes bootFade{to{opacity:1;}}
#boot-bar-wrap{width:300px;height:2px;background:rgba(0,255,136,.1);margin-top:32px;overflow:hidden;}
#boot-bar{height:100%;width:0;background:linear-gradient(90deg,#00ff88,#00d4ff);transition:width .05s;}
#boot-pct{font-size:12px;color:#00ff88;margin-top:8px;letter-spacing:2px;}

/* SCANLINE */
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,255,136,.3),transparent);z-index:9990;pointer-events:none;animation:scanMove 4s linear infinite;}
@keyframes scanMove{0%{top:-2px;}100%{top:100vh;}}

/* CANVAS LAYERS */
#hex-canvas{position:fixed;inset:0;z-index:0;opacity:.06;pointer-events:none;}
#particle-canvas{position:fixed;inset:0;z-index:1;pointer-events:none;}
#matrix-canvas{position:fixed;inset:0;z-index:0;opacity:.05;pointer-events:none;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:14px 48px;background:rgba(2,4,8,.55);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,255,136,.07);transition:all .3s;}
nav.scrolled{background:rgba(2,4,8,.93);border-bottom-color:rgba(0,255,136,.2);}
.nav-logo{font-family:'Orbitron',monospace;font-size:17px;font-weight:700;background:linear-gradient(135deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text2);text-decoration:none;letter-spacing:1px;transition:color .3s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:linear-gradient(90deg,#00ff88,#00d4ff);transform:scaleX(0);transition:transform .3s;}
.nav-links a:hover{color:#00ff88;} .nav-links a:hover::after{transform:scaleX(1);}
.nav-right{display:flex;gap:12px;align-items:center;}
.nav-cta{font-family:'Share Tech Mono',monospace;font-size:11px;padding:7px 18px;border:1px solid var(--neon);color:var(--neon);background:transparent;cursor:none;transition:all .3s;letter-spacing:1px;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
.nav-cta:hover{background:var(--neon);color:#000;}
.nav-resume{font-family:'Share Tech Mono',monospace;font-size:11px;padding:7px 18px;border:1px solid var(--neon2);color:var(--neon2);background:transparent;cursor:none;transition:all .3s;letter-spacing:1px;clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%);}
.nav-resume:hover{background:var(--neon2);color:#000;}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:none;background:none;border:none;}
.hamburger span{display:block;width:22px;height:2px;background:var(--neon);}

/* HERO */
#hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:2;padding:80px 48px 0;}
.hero-grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,255,136,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,136,.025) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;}
.hero-glow{position:absolute;inset:0;background:radial-gradient(ellipse 50% 40% at 50% 50%,rgba(0,255,136,.04),transparent 70%);pointer-events:none;}
.hero-content{position:relative;z-index:3;max-width:920px;text-align:center;}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--neon);letter-spacing:3px;padding:6px 16px;border:1px solid rgba(0,255,136,.25);background:rgba(0,255,136,.03);margin-bottom:24px;animation:fadeInDown .8s ease both;}
.hero-tag-dot{width:6px;height:6px;border-radius:50%;background:var(--neon);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,255,136,.5);}50%{box-shadow:0 0 0 6px rgba(0,255,136,0);}}
.hero-title{font-family:'Orbitron',monospace;font-size:clamp(38px,6.5vw,84px);font-weight:900;line-height:1.02;letter-spacing:2px;margin-bottom:18px;animation:fadeInUp .9s ease .1s both;}
.name-glow{background:linear-gradient(135deg,#00ff88 0%,#00d4ff 50%,#00ff88 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s linear infinite;}
@keyframes shimmer{to{background-position:200% center;}}
.hero-subtitle{font-family:'Rajdhani',sans-serif;font-size:clamp(13px,1.8vw,17px);font-weight:500;color:var(--text2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;animation:fadeInUp .9s ease .2s both;}
.hero-tagline{font-size:clamp(15px,2.2vw,21px);font-weight:600;color:var(--text);margin-bottom:40px;animation:fadeInUp .9s ease .3s both;}
.hero-tagline em{color:var(--neon);font-style:normal;}

/* TERMINAL */
.hero-terminal{background:rgba(2,8,14,.85);border:1px solid rgba(0,255,136,.2);padding:18px 22px;margin-bottom:40px;text-align:left;max-width:580px;margin-left:auto;margin-right:auto;backdrop-filter:blur(16px);animation:fadeInUp .9s ease .4s both;position:relative;overflow:hidden;}
.hero-terminal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#00ff88,transparent);}
.t-bar{display:flex;gap:7px;margin-bottom:14px;align-items:center;}
.td{width:9px;height:9px;border-radius:50%;}
.td1{background:#ff5f56;}.td2{background:#ffbd2e;}.td3{background:#27c93f;}
.t-title{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);margin-left:auto;letter-spacing:1px;}
.tl{font-family:'Share Tech Mono',monospace;font-size:13px;line-height:1.9;}
.tl .p{color:var(--neon);}.tl .c{color:#00d4ff;}.tl .o{color:var(--text2);}.tl .h{color:#fff;}
#typed-text{color:var(--neon);}
.cblink{animation:blink 1s step-end infinite;color:var(--neon);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

.hero-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;animation:fadeInUp .9s ease .5s both;}
.btn-p{font-family:'Orbitron',monospace;font-size:12px;font-weight:600;padding:13px 32px;letter-spacing:2px;cursor:none;background:linear-gradient(135deg,#00ff88,#00d4ff);color:#000;border:none;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .3s;text-decoration:none;display:inline-block;}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(0,255,136,.4);}
.btn-s{font-family:'Orbitron',monospace;font-size:12px;font-weight:600;padding:13px 32px;letter-spacing:2px;cursor:none;background:transparent;color:var(--neon2);border:1px solid var(--neon2);clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .3s;text-decoration:none;display:inline-block;}
.btn-s:hover{background:rgba(0,212,255,.08);transform:translateY(-3px);box-shadow:0 0 30px rgba(0,212,255,.2);}
.btn-dl{font-family:'Orbitron',monospace;font-size:12px;font-weight:600;padding:13px 32px;letter-spacing:2px;cursor:none;background:transparent;color:var(--neon4);border:1px solid var(--neon4);clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .3s;text-decoration:none;display:inline-block;}
.btn-dl:hover{background:rgba(255,180,0,.08);transform:translateY(-3px);box-shadow:0 0 30px rgba(255,180,0,.2);}
.hero-scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);letter-spacing:2px;animation:fadeIn 1s ease 1s both;}
.scroll-line{width:1px;height:36px;background:linear-gradient(#00ff88,transparent);animation:scrollPulse 2s ease-in-out infinite;}
@keyframes scrollPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* SECTION */
section{position:relative;z-index:2;padding:100px 48px;}
.container{max-width:1200px;margin:0 auto;}
.section-header{margin-bottom:60px;}
.section-label{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--neon);letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.section-label::before{content:'//';color:var(--neon2);}
.section-title{font-family:'Orbitron',monospace;font-size:clamp(26px,4vw,46px);font-weight:700;line-height:1.1;letter-spacing:1px;}
.section-title span{background:linear-gradient(135deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.section-line{width:70px;height:2px;margin-top:18px;background:linear-gradient(90deg,#00ff88,#00d4ff,transparent);}

/* ABOUT */
#about{background:var(--bg2);}
.about-grid{display:grid;grid-template-columns:1fr 1.7fr;gap:72px;align-items:center;}
.about-img-frame{width:260px;height:260px;position:relative;margin:0 auto;}
.about-img-ph{width:260px;height:260px;background:linear-gradient(135deg,#0a1929,#040d14);border:2px solid rgba(0,255,136,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;box-shadow:0 0 50px rgba(0,255,136,.08),inset 0 0 60px rgba(0,255,136,.02);}
.about-initials{font-family:'Orbitron',monospace;font-size:68px;font-weight:900;background:linear-gradient(135deg,#00ff88,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.about-name-tag{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--neon);letter-spacing:3px;position:absolute;bottom:18px;}
.glow-r{position:absolute;border:1px solid rgba(0,255,136,.18);animation:glowP 3s ease-in-out infinite;}
.glow-r:nth-child(1){inset:-10px;} .glow-r:nth-child(2){inset:-22px;border-color:rgba(0,212,255,.1);animation-delay:1.5s;}
@keyframes glowP{0%,100%{box-shadow:0 0 15px rgba(0,255,136,.08);}50%{box-shadow:0 0 35px rgba(0,255,136,.2);}}
.about-badge{position:absolute;bottom:-18px;right:-18px;z-index:3;background:linear-gradient(135deg,#00ff88,#00d4ff);color:#000;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;padding:8px 14px;letter-spacing:1px;clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);}
.about-stats{display:flex;gap:16px;margin-top:40px;justify-content:center;flex-wrap:wrap;}
.stat-c{background:rgba(0,255,136,.03);border:1px solid rgba(0,255,136,.12);padding:14px 18px;text-align:center;clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);transition:all .3s;}
.stat-c:hover{background:rgba(0,255,136,.07);border-color:rgba(0,255,136,.35);transform:translateY(-4px);}
.stat-n{font-family:'Orbitron',monospace;font-size:20px;font-weight:700;color:var(--neon);}
.stat-l{font-size:10px;color:var(--text2);letter-spacing:1px;font-family:'Share Tech Mono',monospace;}
.about-text p{font-size:16px;font-weight:400;line-height:1.85;color:var(--text2);margin-bottom:18px;}
.about-text p strong{color:var(--neon);font-weight:600;}
.about-text p em{color:var(--neon2);font-style:normal;}
.about-hl{border-left:2px solid var(--neon);padding:14px 20px;background:rgba(0,255,136,.03);margin-top:24px;font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--text);line-height:1.7;}

/* SKILLS */
#skills{background:var(--bg);}
.skills-layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;}
.skills-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.skill-cat{background:rgba(4,13,20,.85);border:1px solid rgba(0,255,136,.1);padding:24px;position:relative;overflow:hidden;transition:all .4s;}
.skill-cat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--cc,#00ff88),transparent);}
.skill-cat:hover{border-color:rgba(0,255,136,.3);transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,255,136,.06);}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.cat-ico{font-size:20px;}
.cat-t{font-family:'Orbitron',monospace;font-size:12px;font-weight:600;color:#fff;letter-spacing:1px;}
.ski{margin-bottom:12px;}
.ski-n{display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--text);margin-bottom:5px;}
.ski-p{color:var(--neon);font-size:10px;}
.ski-bar{height:2px;background:rgba(255,255,255,.05);overflow:hidden;}
.ski-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cc,#00ff88),rgba(0,212,255,.8));transition:width 1.3s cubic-bezier(.4,0,.2,1) var(--dl,0s);}
.skill-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.sk-tag{font-family:'Share Tech Mono',monospace;font-size:10px;padding:3px 9px;border:1px solid rgba(0,255,136,.18);background:rgba(0,255,136,.03);color:var(--text2);transition:all .3s;}
.sk-tag:hover{border-color:var(--neon);color:var(--neon);}

/* RADAR CHART */
.radar-wrap{display:flex;flex-direction:column;align-items:center;}
.radar-title{font-family:'Orbitron',monospace;font-size:14px;color:#fff;letter-spacing:2px;margin-bottom:24px;text-align:center;}
#radar-canvas{display:block;}
.radar-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;}
.rl-item{display:flex;align-items:center;gap:6px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);}
.rl-dot{width:8px;height:8px;border-radius:50%;}

/* PROJECTS */
#projects{background:var(--bg2);}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;}
.project-card{background:rgba(4,13,20,.92);border:1px solid rgba(0,255,136,.1);overflow:hidden;position:relative;transition:border-color .4s;transform-style:preserve-3d;will-change:transform;}
.project-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,255,136,.04),rgba(0,212,255,.02));opacity:0;transition:opacity .4s;pointer-events:none;}
.project-card:hover{border-color:rgba(0,255,136,.4);}
.project-card:hover::before{opacity:1;}
.proj-visual{height:190px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.pv1{background:linear-gradient(135deg,#0a1929,#020a12);}
.pv2{background:linear-gradient(135deg,#0a1420,#020a14);}
.pv3{background:linear-gradient(135deg,#14100a,#0a0804);}
.pv1::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(255,0,60,.15),transparent 60%),radial-gradient(ellipse at 70% 30%,rgba(0,255,136,.08),transparent 50%);}
.pv2::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,212,255,.14),transparent 60%);}
.pv3::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(255,180,0,.12),transparent 60%);}
.p-ico{font-size:52px;position:relative;z-index:1;}
.p-badge{position:absolute;top:14px;right:14px;z-index:2;font-family:'Share Tech Mono',monospace;font-size:9px;padding:4px 9px;letter-spacing:1px;}
.b-red{border:1px solid rgba(255,0,60,.5);color:#ff003c;background:rgba(255,0,60,.05);}
.b-blue{border:1px solid rgba(0,212,255,.5);color:#00d4ff;background:rgba(0,212,255,.05);}
.b-gold{border:1px solid rgba(255,180,0,.5);color:#ffb400;background:rgba(255,180,0,.05);}
.proj-body{padding:24px;}
.p-num{font-family:'Orbitron',monospace;font-size:10px;color:var(--text2);letter-spacing:2px;margin-bottom:6px;}
.p-title{font-family:'Orbitron',monospace;font-size:17px;font-weight:700;color:#fff;margin-bottom:10px;line-height:1.3;}
.p-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px;}
.p-feats{margin-bottom:16px;}
.pf{display:flex;align-items:flex-start;gap:7px;font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text2);margin-bottom:5px;}
.pf::before{content:'▸';color:var(--neon);font-size:9px;margin-top:2px;flex-shrink:0;}
.tech-stack{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px;}
.t-tag{font-family:'Share Tech Mono',monospace;font-size:10px;padding:3px 9px;border:1px solid rgba(0,212,255,.2);color:var(--neon2);background:rgba(0,212,255,.03);}
.p-link{font-family:'Orbitron',monospace;font-size:10px;font-weight:600;padding:9px 20px;letter-spacing:2px;cursor:none;background:transparent;color:var(--neon);border:1px solid rgba(0,255,136,.3);clip-path:polygon(5px 0%,100% 0%,calc(100% - 5px) 100%,0% 100%);transition:all .3s;text-decoration:none;display:inline-block;}
.p-link:hover{background:rgba(0,255,136,.08);border-color:var(--neon);}

/* CERTIFICATIONS */
#certifications{background:var(--bg);}
.certs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
.cert-card{background:rgba(4,13,20,.8);border:1px solid rgba(0,255,136,.1);padding:24px;position:relative;overflow:hidden;transition:all .4s;display:flex;flex-direction:column;gap:12px;}
.cert-card::after{content:'';position:absolute;top:0;right:0;width:40px;height:40px;background:linear-gradient(225deg,rgba(0,255,136,.08),transparent);pointer-events:none;}
.cert-card:hover{border-color:rgba(0,255,136,.35);transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,255,136,.06);}
.cert-icon{font-size:28px;}
.cert-provider{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--neon);letter-spacing:2px;}
.cert-name{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;color:#fff;line-height:1.3;}
.cert-date{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--text2);}
.cert-badge{display:inline-flex;align-items:center;gap:5px;font-family:'Share Tech Mono',monospace;font-size:10px;padding:3px 10px;border:1px solid rgba(0,255,136,.2);color:var(--neon);background:rgba(0,255,136,.03);width:fit-content;}
.cert-badge::before{content:'✓';color:var(--neon);}

/* ACHIEVEMENTS */
#achievements{background:var(--bg2);}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;}
.ach-card{background:rgba(4,13,20,.6);border:1px solid rgba(0,255,136,.1);padding:24px;position:relative;overflow:hidden;transition:all .4s;}
.ach-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:linear-gradient(180deg,var(--neon),var(--neon2));transition:height .4s;}
.ach-card:hover::before{height:100%;}
.ach-card:hover{transform:translateX(4px);border-color:rgba(0,255,136,.3);}
.ach-ico{font-size:32px;margin-bottom:14px;display:block;}
.ach-t{font-family:'Orbitron',monospace;font-size:14px;font-weight:600;color:#fff;margin-bottom:7px;}
.ach-d{font-size:13px;color:var(--text2);line-height:1.7;}
.ach-date{font-family:'Share Tech Mono',monospa
