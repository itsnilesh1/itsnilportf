const SK=[['Cybersecurity',[['OWASP Top 10',75],['VAPT',60],['Bug Hunting',65],['Web App Security',65]]],['Programming',[['Python',75],['C++',65],['SQL / PL-SQL',65],['Java',60]]],['Networking',[['TCP/IP',70],['OSI Model',70],['Packet Analysis',55]]]];
const PJ=[
{k:'Security tool',t:'Laptop Intruder Detection System',d:'Intelligent surveillance that triggers on failed logins — captures the intruder silently and fires alerts with location in real time.',f:['Detects failed login attempts autonomously','Silent photo/video capture via OpenCV','Telegram & email alerts with evidence','Location tracking included'],g:['Python','OpenCV','SMTP','Telegram API','GPS'],
 s:['<b>Login attempt monitor.</b> Hooks into the OS authentication layer using system logs and PAM. Any failed login triggers the detection pipeline immediately.','<b>Webcam capture.</b> OpenCV captures a burst of photos and 10 seconds of video of whoever is in front of the laptop.','<b>Location lookup.</b> Public IP geolocation APIs return the approximate location of the laptop.','<b>Telegram and email alert.</b> Within about 3 seconds, the photo, video clip, timestamp and location are sent through the Telegram Bot API and SMTP email.','<b>Evidence logging.</b> Captures are timestamped and stored locally in an encrypted folder. Each incident gets a unique ID so repeated attempts can be tracked.'],
 n:'Insider attacks, shoulder surfing and physical device theft are among the most overlooked attack vectors. Automating evidence capture on the device goes beyond typical software-only security tools.',
 c:[['Speed: a 3-second alert window.','The first version took 8–10 seconds from trigger to alert. Async Python (asyncio) runs capture and upload in parallel and brings it under 3 seconds.'],['Reliability without internet.','If Wi-Fi is down, alerts queue locally and send as soon as connectivity returns, so no evidence is lost.']]},
{k:'ML + fintech',t:'FacePay — Face Recognition Payment',d:'Biometric Android payment concept using face recognition as an alternative to PIN-based authentication, redirecting to UPI apps after identity verification.',f:['Face recognition as an authentication factor','Seamless UPI app redirection','ML-powered identity verification','Explores biometric authentication as an alternative mechanism'],g:['Java','Android Studio','ML Kit','UPI API','Camera2','Room','Android Keystore'],
 s:['<b>Face enrollment.</b> On first launch, the user\'s face is captured from several angles with the front camera. ML Kit face detection processes the images and the face template is stored on the device.','<b>Liveness detection.</b> To resist photo and video spoofing, the app asks the user to blink, smile or turn their head.','<b>Face matching.</b> At payment time the live camera feed is compared against the stored template, with a high match threshold balancing security and usability.','<b>UPI deep link redirect.</b> After a successful match, the app builds a UPI deep link with the merchant details and opens the user\'s UPI app (GPay, PhonePe, BHIM) for final confirmation.','<b>Transaction logging.</b> Every attempt is logged with timestamp, match score and device ID. Three failed attempts trigger a lockout to block brute force.'],
 n:'PINs and passwords can be stolen, guessed or shoulder-surfed. FacePay explores biometric authentication as an alternative, with on-device processing so biometric data never leaves the phone. It is a student exploration of privacy-conscious security design, not a claim of complete or unbreakable security.',
 c:[['Anti-spoofing.','Multi-frame liveness checks that need real facial movement block printed photos and screen videos.'],['Lighting variation.','Tuned ML Kit parameters and added image preprocessing (histogram equalization) to keep recognition steady across lighting conditions.'],['UPI app compatibility.','Tested with GPay, PhonePe, Paytm and BHIM, and built a layer that detects installed apps and builds the right link format.']]},
{k:'Hardware',t:'RFID Attendance System',d:'Built and demoed at TechFusion Fest — a hardware-software attendance system with real-time RFID tracking and automated reporting.',f:['Contactless RFID attendance tracking','Real-time hardware and software sync','Automated reporting pipeline','Showcased at TechFusion Fest, ADYPSOE'],g:['RFID RC522','Arduino Uno','Python + pyserial','SQLite3','Tkinter','MIFARE'],
 s:['<b>Card tap detection.</b> Each student has a unique 13.56 MHz MIFARE card. Tapping the RC522 reader sends the card\'s UID to the Arduino Uno over SPI.','<b>Arduino serial processing.</b> The Arduino debounces repeated reads (1-second lockout per card) and sends the UID to the computer over USB serial at 9600 baud.','<b>Python backend.</b> A pyserial script receives the UID, looks up the student\'s name and roll number in SQLite and records the timestamp within 200 ms of the tap.','<b>Database and records.</b> SQLite holds student profiles and attendance records. Duplicate entries within a 10-minute window are rejected.','<b>Real-time dashboard.</b> A Tkinter dashboard shows each tap live with name, photo and time. Teachers can export CSV reports for any date range.'],
 n:'RFID cards can be cloned with tools like Proxmark3. This design treats UIDs as identifiers, not secrets. A production version would add encrypted card data and server-side validation to prevent cloning.',
 c:[['Preventing double registration.','A 1-second lockout in the firmware and a 10-minute duplicate window in the database stop accidental double marking.'],['Serial reliability.','Auto-reconnect logic in Python re-establishes the port without restarting the app.'],['Demo reliability.','For the TechFusion Fest demo I ran 48-hour stress tests with 500+ card taps, fixed UID parsing edge cases and prepared a backup SD card with the software pre-configured.']]}];

const R={
about:()=>`<p class="lead">I build security tools, then try to break them.</p><p>Intruder alerts that took 8–10 seconds now land in under 3, thanks to asyncio. A face-payment app that a photo could fool now needs a real blink. An RFID tracker that double-counted taps now rejects them.</p><p>I'm <b>Nilesh Patil</b>, a Computer Engineering student in Pune, now in B.E. (Direct Second Year) at P.V.P.I.T. Bavdhan. I work on cybersecurity, AI/ML and software, and I learn mostly by building something and fixing whatever breaks. My intruder detector took 8–10 seconds to alert until I ran capture and upload in parallel with asyncio. My RFID attendance tracker double-counted taps until I added a 1-second firmware lockout and a 10-minute duplicate window. FacePay could be fooled by a photo, so I added liveness checks that need real movement.</p><p>I completed my <b>Diploma in Computer Engineering</b> from Ajeenkya DY Patil School of Engineering (MSBTE) in 2026 with an <b>84.94% aggregate</b> (88.24% in my final semester), graduating with First Class with Distinction. During my diploma, I developed a strong interest in cybersecurity — particularly web application security and bug bounty concepts — alongside programming, networking, and AI/ML.</p><p>I enjoy building projects that bring these interests together, from security tools to hardware-integrated systems, while continuing to strengthen my technical foundation as I progress through my engineering degree.</p><div class="bq">Understanding how systems can be broken is often the first step to learning how to build them securely.</div><div class="st"><div><b>3+</b>Projects</div><div><b>4+</b>Certifications</div><div><b>2026</b>Diploma completed</div></div>`,

function term(bd){
 bd.style.cssText='display:flex;flex-direction:column;padding:0';
 bd.innerHTML='<div class="to" style="flex:1;overflow:auto;padding:14px 16px"></div><div class="tin"><span>nilesh@np_os:~$</span><input type="text" placeholder="Type a command." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Terminal command"></div>';
 const to=bd.firstChild,ti=bd.querySelector('input'),H=[];let hi=0;
 const add=(c,t)=>{const d=document.createElement('div');d.className=c;d.textContent=t;to.appendChild(d);to.scrollTop=to.scrollHeight};
 function run(raw){const cmd=raw.trim();if(!cmd)return;H.push(cmd);hi=H.length;add('p','nilesh@np_os:~$ '+cmd);const w=cmd.toLowerCase().split(/\s+/);
  if(w[0]==='clear'){to.innerHTML='';return}
  const f=CM[w[0]];if(!f){add('e','bash: '+cmd+": command not found. Try 'help'.");return}
  f(w.slice(1)).forEach((r,i)=>setTimeout(()=>add(r[0],r[1]),i*55))}
 ti.onkeydown=e=>{
  if(e.key==='Enter'){e.preventDefault();run(ti.value);ti.value=''}
  else if(e.key==='ArrowUp'&&H.length){e.preventDefault();hi=Math.max(0,hi-1);ti.value=H[hi]}
  else if(e.key==='ArrowDown'&&H.length){e.preventDefault();hi=Math.min(H.length,hi+1);ti.value=H[hi]||''}
  else if(e.key==='Tab'&&ti.value){const v=ti.value.toLowerCase(),m=Object.keys(CM).filter(c=>c.startsWith(v));if(m.length===1){e.preventDefault();ti.value=m[0]}else if(m.length>1){e.preventDefault();add('r',m.join('   '))}}};
 bd.addEventListener('click',()=>getSelection().isCollapsed&&ti.focus());
 add('p','NP_OS terminal ready.');add('r',"Type help to get started, or try: sudo hire nilesh");
 if(innerWidth>700)setTimeout(()=>ti.focus(),50)
}

  if(d._gotcha)return;b.disabled=true;b.textContent='TRANSMITTING...';st.textContent='';
  try{const r=await fetch('https://formspree.io/f/xlgawpay',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({name:d.n,email:d.e,subject:d.s,message:d.m,_gotcha:d._gotcha})});
   if(!r.ok)throw 0;b.textContent='MESSAGE SENT ✓';st.textContent='Message delivered. I will reply soon.';f.reset()}
  catch(_){b.textContent='ERROR — TRY AGAIN ✗';st.textContent='Could not send. Check your connection or email me directly.'}
  setTimeout(()=>{b.disabled=false;b.textContent='EXECUTE — SEND MESSAGE'},3000)}}
